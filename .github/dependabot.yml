# Dependabot opens weekly update pull requests for the Bun packages and the GitHub Actions.
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# See .docs/decisions/0044-update-github-actions-with-dependabot.md.

version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # These packages pin each other to exact versions, so they must move together.
      tsparticles:
        patterns:
          - '@tsparticles/*'

  # Reads every workflow in .github/workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      # Gives "ci(deps): bump …", which passes the PR title check.
      prefix: 'ci'
      include: 'scope'
    groups:
      # One pull request a week for every action update, since they rarely conflict.
      github-actions:
        patterns:
          - '*'
