name: Migrate Production Database
# Applies the reviewed Drizzle migrations to production once they reach master (ADR 0040).
# The production connection string lives only in the `production-database` environment, whose
# deployment branch policy allows `master` alone (ADR 0049). A job in any other workflow, or in
# this one run from a pull request or another branch, cannot enter it, even if a pull request
# edits the workflow files: GitHub matches the policy against GITHUB_REF, and pull request runs
# use refs/pull/<number>/merge. Never add this environment, or a production database URL, to a
# workflow that runs on pull requests.
on:
  push:
    branches: [master]
    paths:
      - infrastructure/adapters/src/database/drizzle/**
      - infrastructure/adapters/drizzle.config.ts
      - .github/workflows/migrate-production.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrate-production
  cancel-in-progress: false
jobs:
  migrate:
    name: Migrate Production Database
    # Fails fast on a manual run from another branch; the environment policy enforces it anyway.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: production-database
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install root 🔧
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Migrate 🗄️
        run: bun run db:migrate
        working-directory: ./infrastructure/adapters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
